  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Noto Sans TC"', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Noto Sans TC', sans-serif;
      background-color: #f8fafc;
      -webkit-tap-highlight-color: transparent;
    }
    .header-gradient {
      background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 50%, #0d9488 100%);
    }
    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .hide-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>

<body class="text-slate-800 min-h-screen flex flex-col justify-between selection:bg-teal-500 selection:text-white">

  <div>

        </p>
      </div>
    </header>

    <main class="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8 py-5">

        <div class="flex flex-col sm:flex-row items-center justify-between gap-2.5">
          <div class="relative w-full sm:w-72">
            <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
            <input type="text" id="searchInput" placeholder="搜尋民宿或關鍵字..." 
                   class="w-full pl-9 pr-3.5 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-teal-500 focus:bg-white transition-all">
          </div>

          <div class="flex items-center justify-between sm:justify-end gap-2 w-full sm:w-auto text-xs">
            <span class="text-slate-500 font-medium whitespace-nowrap"><i class="fa-solid fa-arrow-down-short-wide text-teal-600 mr-1"></i>排序：</span>
            <select id="sortSelect" class="bg-slate-50 border border-slate-200 text-slate-700 rounded-xl px-3 py-2 text-xs font-semibold focus:outline-none focus:ring-2 focus:ring-teal-500 cursor-pointer">
              <option value="default">預設推薦順序</option>
              <option value="price-asc">價格：由低至高</option>
              <option value="price-desc">價格：由高至低</option>
            </select>
            <span id="resultCount" class="bg-teal-50 text-teal-700 font-bold px-2.5 py-1.5 rounded-lg border border-teal-100 text-xs">
              共 8 間
            </span>
          </div>
        </div>

        <!-- Facility Filter Buttons (Scrollable on mobile) -->
        <div class="pt-2 border-t border-slate-100">
          <div class="text-[11px] font-semibold text-slate-400 mb-2 uppercase tracking-wider">設施篩選：</div>
          <div class="flex items-center gap-1.5 overflow-x-auto hide-scrollbar pb-1 -mx-1 px-1">
            <button onclick="setFilter('all')" data-filter="all" class="filter-btn active bg-slate-900 text-white px-3 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap shadow-xs transition-all">
              ✨ 全部顯示
            </button>
            <button onclick="setFilter('slide')" data-filter="slide" class="filter-btn bg-slate-100 text-slate-600 hover:bg-slate-200 px-3 py-1.5 rounded-xl text-xs font-medium whitespace-nowrap transition-all">
              🛝 包含溜滑梯
            </button>
            <button onclick="setFilter('ball')" data-filter="ball" class="filter-btn bg-slate-100 text-slate-600 hover:bg-slate-200 px-3 py-1.5 rounded-xl text-xs font-medium whitespace-nowrap transition-all">
              ⚽ 包含球池
            </button>
            <button onclick="setFilter('pool')" data-filter="pool" class="filter-btn bg-slate-100 text-slate-600 hover:bg-slate-200 px-3 py-1.5 rounded-xl text-xs font-medium whitespace-nowrap transition-all">
              🏊‍♂️ 有戲水池/泳池
            </button>
            <button onclick="setFilter('bbq')" data-filter="bbq" class="filter-btn bg-slate-100 text-slate-600 hover:bg-slate-200 px-3 py-1.5 rounded-xl text-xs font-medium whitespace-nowrap transition-all">
              🔥 可烤肉場地
            </button>
          </div>
        </div>
      </div>

      <!-- Mobile Cards Container (block on mobile, hidden on md+) -->
      <div id="mobileCardsContainer" class="space-y-4 md:hidden">
        <!-- JS dynamically renders or filters these cards -->
      </div>

      <!-- Desktop Table Container (hidden on mobile, block on md+) -->
      <div class="hidden md:block bg-white rounded-2xl shadow-xl border border-slate-200 overflow-hidden">
        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse min-w-[900px]">

                <th class="py-4 px-4 sm:px-5 w-44">民宿名稱</th>
                <th class="py-4 px-3 w-28 text-center">溜滑梯</th>
                <th class="py-4 px-3 w-28 text-center">球池</th>
                <th class="py-4 px-3 w-32 text-center">游泳池 / 戲水池</th>
                <th class="py-4 px-3 w-32 text-center">烤肉場地</th>
                <th class="py-4 px-4 w-40 text-center">14人以上假日價格</th>
                <th class="py-4 px-5">親子特色與詳細備註</th>

            <tbody id="desktopTableBody" class="divide-y divide-slate-200 text-xs sm:text-sm">
              <!-- Rendered via JS for unified filter synchronization -->
            </tbody>
          </table>
        </div>
      </div>

      <!-- Empty State Notice -->
      <div id="emptyNotice" class="hidden text-center py-12 bg-white rounded-2xl border border-dashed border-slate-300 my-4">
        <i class="fa-solid fa-house-circle-xmark text-4xl text-slate-300 mb-3"></i>
        <p class="text-slate-600 font-semibold">未找到符合條件的民宿</p>
        <p class="text-slate-400 text-xs mt-1">請嘗試調整搜尋關鍵字或切換設施篩選條件</p>
        <button onclick="resetFilters()" class="mt-4 bg-teal-600 text-white px-4 py-2 rounded-xl text-xs font-semibold hover:bg-teal-700 transition-all">
          重置所有篩選
        </button>
      </div>

    </main>
  </div>

  <footer class="bg-white border-t border-slate-200 py-6 text-center text-xs text-slate-500 mt-8">
    <div class="max-w-7xl mx-auto px-4">

    let currentFilter = 'all';
    let currentSearch = '';
    let currentSort = 'default';

    function renderApp() {
      // Filter list
      let filtered = bnbData.filter(item => {
        // Search filter
        const matchSearch = item.name.includes(currentSearch) || item.desc.includes(currentSearch) || item.poolText.includes(currentSearch) || item.bbqText.includes(currentSearch);
        
        // Facility Filter
        let matchFacility = true;
        if (currentFilter === 'slide') matchFacility = item.hasSlide;
        else if (currentFilter === 'ball') matchFacility = item.hasBall;
        else if (currentFilter === 'pool') matchFacility = item.hasPool;
        else if (currentFilter === 'bbq') matchFacility = item.hasBbq;

        return matchSearch && matchFacility;
      });

      // Sort
      if (currentSort === 'price-asc') {
        filtered.sort((a, b) => a.priceNum - b.priceNum);
      } else if (currentSort === 'price-desc') {
        filtered.sort((a, b) => b.priceNum - a.priceNum);
      }

      // Update Result Count
      document.getElementById('resultCount').textContent = `共 ${filtered.length} 間`;

      // Check empty
      const emptyNotice = document.getElementById('emptyNotice');
      if (filtered.length === 0) {
        emptyNotice.classList.remove('hidden');
      } else {
        emptyNotice.classList.add('hidden');
      }

      renderMobileCards(filtered);
      renderDesktopTable(filtered);
    }

    function renderMobileCards(items) {
      const container = document.getElementById('mobileCardsContainer');
      container.innerHTML = '';

      items.forEach(item => {
        const card = document.createElement('div');
        card.className = 'bg-white rounded-2xl p-4 shadow-sm border border-slate-200/90 space-y-3.5 hover:shadow-md transition-all';

             class="flex-1 inline-flex items-center justify-center gap-1.5 bg-gradient-to-r ${link.color} text-white font-semibold py-2.5 px-3 rounded-xl shadow-xs text-xs active:scale-95 transition-all">
            <i class="${link.icon}"></i>
            <span>${link.name}</span>
            <i class="fa-solid fa-arrow-up-right-from-square text-[10px] opacity-80"></i>
          </a>
        `).join('');

        card.innerHTML = `
          <!-- Header: Name & Price -->
          <div class="flex items-start justify-between gap-2 pb-3 border-b border-slate-100">
            <div>
              <h3 class="text-base font-extrabold text-slate-900 tracking-tight">${item.name}</h3>
              <div class="text-[11px] text-slate-500 mt-0.5">${item.priceTitle}</div>
            </div>
            <div class="text-right">
              <div class="text-base font-black text-rose-600">${item.priceDisplay}</div>
              ${item.priceNote ? `<div class="text-[10px] text-amber-700 bg-amber-50 px-1.5 py-0.5 rounded font-medium mt-0.5 inline-block">${item.priceNote}</div>` : ''}
            </div>
          </div>

          <!-- Facility Badges Grid -->
          <div class="grid grid-cols-2 gap-2 text-xs">
            <div class="flex items-center justify-between p-2 rounded-xl ${item.hasSlide ? 'bg-emerald-50/70 border border-emerald-100/80 text-emerald-900' : 'bg-slate-50 border border-slate-100 text-slate-400'}">
              <span class="font-medium text-[11px]"><i class="fa-solid fa-sliders mr-1 text-slate-400"></i>溜滑梯</span>
              <span class="font-bold text-[11px]">${item.slideText}</span>
            </div>

            <div class="flex items-center justify-between p-2 rounded-xl ${item.hasBall ? 'bg-emerald-50/70 border border-emerald-100/80 text-emerald-900' : 'bg-slate-50 border border-slate-100 text-slate-400'}">
              <span class="font-medium text-[11px]"><i class="fa-solid fa-circle-dot mr-1 text-slate-400"></i>球池</span>
              <span class="font-bold text-[11px]">${item.ballText}</span>
            </div>

            <div class="flex items-center justify-between p-2 rounded-xl ${item.hasPool ? 'bg-blue-50/70 border border-blue-100/80 text-blue-900' : 'bg-slate-50 border border-slate-100 text-slate-400'}">
              <span class="font-medium text-[11px]"><i class="fa-solid fa-water mr-1 text-blue-400"></i>戲水/泳池</span>
              <span class="font-bold text-[11px]">${item.poolText}</span>
            </div>

            <div class="flex items-center justify-between p-2 rounded-xl ${item.hasBbq ? 'bg-amber-50/70 border border-amber-100/80 text-amber-900' : 'bg-slate-50 border border-slate-100 text-slate-400'}">
              <span class="font-medium text-[11px]"><i class="fa-solid fa-fire-burner mr-1 text-amber-500"></i>烤肉場地</span>
              <span class="font-bold text-[11px]">${item.bbqText}</span>
            </div>
          </div>

          <!-- Description -->
          <div class="bg-slate-50/80 p-2.5 rounded-xl border border-slate-100 text-xs text-slate-600 leading-relaxed">
            <span class="font-bold text-slate-800">特色說明：</span>${item.desc}
          </div>

          <!-- Buttons -->

    function renderDesktopTable(items) {
      const tbody = document.getElementById('desktopTableBody');

      items.forEach(item => {

        const linksHtml = item.links.map(link => `

            ${item.hasSlide 
              ? `<span class="inline-flex items-center gap-1 font-semibold text-emerald-700 bg-emerald-50 px-2 py-1 rounded-lg border border-emerald-200"><i class="fa-solid fa-circle-check text-emerald-600"></i> ${item.slideText}</span>` 
              : `<span class="inline-flex items-center gap-1 text-slate-400"><i class="fa-solid fa-circle-xmark text-rose-400"></i> 無</span>`}
          </td>
          <td class="py-4 px-3 text-center">
            ${item.hasBall 
              ? `<span class="inline-flex items-center gap-1 font-semibold text-emerald-700 bg-emerald-50 px-2 py-1 rounded-lg border border-emerald-200"><i class="fa-solid fa-circle-check text-emerald-600"></i> ${item.ballText}</span>` 
              : `<span class="inline-flex items-center gap-1 text-slate-500 bg-slate-100 px-2 py-1 rounded-lg text-[11px]"><i class="fa-solid fa-circle-xmark text-rose-400"></i> ${item.ballText}</span>`}
          </td>
          <td class="py-4 px-3 text-center font-medium text-slate-700">
            ${item.poolText}
          </td>
          <td class="py-4 px-3 text-center">
            <span class="inline-flex items-center gap-1 text-emerald-700 font-medium">
              <i class="fa-solid fa-check text-emerald-600"></i> ${item.bbqText}
            </span>
          </td>
          <td class="py-4 px-4 text-center">
            <div class="font-extrabold text-slate-900 text-sm">${item.priceTitle}</div>
            <div class="text-rose-600 font-bold">${item.priceDisplay}</div>
            ${item.priceNote ? `<div class="text-[10px] text-amber-700 font-medium mt-0.5">${item.priceNote}</div>` : ''}
          </td>
          <td class="py-4 px-5 text-slate-600 leading-relaxed max-w-xs">
            ${item.desc}
          </td>
          <td class="py-4 px-4 text-center">
            <div class="flex flex-col gap-1.5">
              ${linksHtml}
            </div>
          </td>
        `;

        tbody.appendChild(tr);
      });
    }

    // Filter Trigger
    function setFilter(filterType) {
      currentFilter = filterType;
      document.querySelectorAll('.filter-btn').forEach(btn => {
        if (btn.getAttribute('data-filter') === filterType) {
          btn.className = 'filter-btn active bg-slate-900 text-white px-3 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap shadow-xs transition-all';
        } else {
          btn.className = 'filter-btn bg-slate-100 text-slate-600 hover:bg-slate-200 px-3 py-1.5 rounded-xl text-xs font-medium whitespace-nowrap transition-all';
        }
      });
      renderApp();
    }

    function resetFilters() {
      currentFilter = 'all';
      currentSearch = '';
      currentSort = 'default';
      document.getElementById('searchInput').value = '';
      document.getElementById('sortSelect').value = 'default';
      setFilter('all');
    }

    // Event Listeners
    document.getElementById('searchInput').addEventListener('input', (e) => {
      currentSearch = e.target.value.trim();
      renderApp();
    });

    document.getElementById('sortSelect').addEventListener('change', (e) => {
      currentSort = e.target.value;
      renderApp();
    });

    // Initial Render
    window.onload = function() {
      renderApp();
    };
  </script>
</body>
</html>
